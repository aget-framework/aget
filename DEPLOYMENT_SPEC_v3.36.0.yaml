  - tests/migration_kit/test_migration_kit_open_receiver.py
  - tests/migration_kit/test_migration_kit_plan_protected.py
  - tests/migration_kit/test_migration_kit_public_surface.py
  - tests/migration_kit/test_migration_kit_push_baseline_equal.py
  - tests/migration_kit/test_migration_kit_release_target.py
  - tests/migration_kit/test_migration_kit_suite_at_commit.py
  - tests/migration_kit/test_migration_kit_watch_receiver.py
  detection: |-
    python3 -c "import yaml" && python3 -m pytest -q -p no:cacheprovider tests/migration_kit
  detection_scope: "Round 2 and Round 2b name the two pre-publication correction passes: documentation and behaviour fixes, followed by protected-mode, after-run consumer and provenance fixes. Historical Round 2 local source verification gave 1523 passed on Python 3.14.8 and Python 3.12.13 before the protected-mode changes. The later protected-mode and after-run consumer corrections also passed the full local kit suite on both interpreters before this text-only amendment. Re-run the kit suite on the tagged checkout and record its measured count; the prior candidate result does not establish verification of the amended commit. Not a GitHub CI or further outcome result. Shipped source tests only, run in the core repository with the kit's
    one declared dependency (PyYAML) installed. The tests set a 3.34.0 to 3.35.0 target,
    so this command exercises 3.34.0 to 3.35.0 content. On the release candidate before the release
    files were added (an earlier internal candidate), on Python 3.14, this command gave 393 passed; on an earlier re-based internal candidate, the kit suite gave 1476 passed on Python 3.14.8 and on Python 3.12.13 outside the builder sandbox. The eight behaviour fixes made after review have unit-test coverage; the later second outcome run exercised the worker path and returned FAIL, accepted as named limits under weekly-train:R59. Not evidence that the
    kit migrates a fleet. Shown in rehearsal - one ordinary member, in a throwaway
    copy, migrated and pushed by a supervisor session told to work from the procedure's
    kit section (the section did not suffice by itself); a harder member migrated
    and verified but not pushed; a supervisor built from the public template preparing
    and applying a batch after ordinary setup, mechanically in a scratch folder and
    not by a
    live session; a live run by a supervisor built fresh from the public template, three members in one batch on two typed lines, with local remotes, on the kit at an earlier internal candidate (v3.36.0 is published as a single commit; the earlier internal candidates cited in review are not in the public history. The released kit differs from that candidate in two ways - by text-only changes that reworded function descriptions, comments, the guide and the procedure; and by eight behaviour fixes made after independent reviews, to the push authority check, the isolation of every copy and clone the kit makes (the folder tests of a launch with the copy-root option among them), the session rehearsal's verdict, the after-run confirmation run, the suite check at the commit, the ledger's workflow comparison, the protected-write classification and the refusal to write through a symbolic link. the fixes have unit-test coverage, and the later second outcome run exercised the worker path through apply, launch, push and the ledger, returning FAIL accepted as named limits under weekly-train:R59); it ran in the tool's automatic permission mode, read documents beyond the procedure's kit section, and stopped at the ledger step. Not shown - a push for the harder member (the suite check
    before the push failed fewer tests than the member's baseline, the kit's waiver
    accepts only an exactly equal set, and the kit has no route from there yet);
    the close-out gate passing (members in separate repositories that carry a root
    workflow need a readable, successful GitHub continuous-integration result on
    their exact published commit, and the kit has no success route for continuous
    integration that is not on GitHub; a root shared by several members has a
    separate route, described in the release notes);
    the close-gate rejection check in a member's session; a held commit, a scope
    override, or a receiver's own window with the watcher; a remote on GitHub or
    an external continuous-integration result in a run by a template-built supervisor; any command-line tool other than Claude Code; a real fleet
    deployed to 3.36.0. The typed waiver for a failing suite is shown by tests only.
    Three further fixes made after the first outcome test are covered by failing-first tests: the launcher accepts the null apply receipt that B1 writes before apply, for packet reading and baseline launches, while a migration launch still needs a receipt; parallel members can create their shared contained environment without a directory-creation collision, and links or non-directories still refuse; and default packet and confirmation folders now sit beside the batch packet, under <packet folder>/<release>/packets/ and <packet folder>/<release>/runs/, with the explicit environment overrides retained. The packet folder must lie outside every git repository, every member and the framework clones. The second outcome test ran on 2026-10-06: a fresh template-built supervisor took two worker members from 3.35.1 to v3.36.0 through apply, launch, push to local remotes and the ledger. Its result was FAIL: P3 exceeded the principal-line count and P6 exceeded the principal-wait time. The principal accepted that FAIL as named limits under weekly-train:R59, including F-3/F-5/F-6/F-8 and the hooks refusal; F-5 was subsequently fixed by the cache-free default. Supervisor-template members stay INCONCLUSIVE. This fixture run is not evidence of real-fleet deployment or GitHub continuous integration.
    The release notes carry the full statement and the known gaps. "
- id: M-3.36-2
  description: The fleet migration procedure moves from 1.9.0 to 1.10.8. It adds the
    kit batch procedure (fifteen steps, B0 to B13 with B8a), the setup a supervisor
    needs before the first command (copying the kit, installing its dependency, a
    committed fleet register, the release target file, the framework clones), a blocking
    release-outcome close-out gate, and a statement that the kit is built, tested
    and rehearsed with Claude Code only.
  surfaces: [core]
  blocking: false
  paths:
  - sops/SOP_fleet_migration.md
  detection: |-
    python3 -c "import sys; t=open('sops/SOP_fleet_migration.md').read(); sys.exit(0 if '**Version**: 1.10.8' in t and '## Kit Batch Procedure' in t else 1)"
  detection_scope: Presence of the version line and the section heading only; not evidence
    that a supervisor can run a batch from the section alone. In rehearsal the section
    did not suffice by itself - the session also read the kit's session guide, the
    plan skill with its template and specification, and the source of four kit tools.
    In the later live run the supervisor also read one tool's documentation for the
    rules a typed line must meet.
- id: M-3.36-3
  description: Retained from v3.35.1, not new in v3.36.0. AGET_VOCABULARY_SPEC moves from 1.17.0 to 1.18.0. It adds CAP-VOC-006
    Grounded Term Display Form (seven requirement rows, six verification rows) - how
    a registered term is written when highlighted in prose. It also changes existing
    text - R-VOC-PROSE-001, R-VOC-PROSE-003, CAP-VOC-002-03, CAP-VOC-004-02, V-VOCAB-009,
    the marking convention table and the compound-form pattern now state that they
    govern the specification's own register, and highlights follow CAP-VOC-006. The
    same change redefines Aget_Instance - it is now a narrower term of Aget_Agent,
    no longer of Aget_AI_System, and its definition says it is the concrete agent
    created from a template. The specification's own 1.18.0 changelog does not list
    this redefinition. No file to place; no receiver action at migration.
  surfaces: [core]
  blocking: false
  paths:
  - specs/AGET_VOCABULARY_SPEC.md
  detection: |-
    python3 -c "import sys; t=open('specs/AGET_VOCABULARY_SPEC.md').read(); sys.exit(0 if all('CAP-VOC-006-0%d' % i in t for i in range(1, 8)) else 1)"
  detection_scope: Presence of the seven requirement rows only. Four of the six verification
    rows are marked automated with the canonical check owed; no shipped test or checker
    for these rows is named by this release.
- id: M-3.36-4
  description: Retained from v3.35.1, not new in v3.36.0. Study-topic no longer prints a novel-topic verdict when the score floor
    suppressed hits; it reports the suppressed count and the option that lifts the
    floor.
  surfaces: [core, templates]
  blocking: false
  paths:
  - scripts/study_topic.py
  source_tests:
  - tests/test_study_topic_relevance_floor.py
  detection: |-
    python3 -m pytest -q tests/test_study_topic_relevance_floor.py
  detection_scope: Shipped source test only, in the core repository; receiver-owned
    behaviour and acceptance require separate evidence.
- id: M-3.36-5
  description: Retained from v3.35.1, not new in v3.36.0. The runtime-support evidence checker declares the instruction surface
    of one additional terminal agent, so that its instructability reads from the
    tool's own help text and no longer reads unknown; a desktop launcher answering
    to the same name does not borrow the entry. The command-line support matrix
    (1.1.0 to 1.2.0) records the re-measurement and keeps that tool Experimental,
    with governed use unproven and the compatibility suite not run. The same edit
    dates, from the vendor's notice, when another listed tool stopped serving individual
    accounts and two named subscription plans. This is a measurement record, not
    a support claim; no receiver action.
  surfaces: [core]
  blocking: false
  paths:
  - scripts/check_runtime_support_evidence.py
  - docs/AGET_CLI_SUPPORT_MATRIX.md
  source_tests:
  - tests/test_runtime_support_evidence.py
  detection: |-
    python3 -m pytest -q tests/test_runtime_support_evidence.py
  detection_scope: Shipped source test only; it tests the checker's reading of declared
    help text, not any tool's behaviour under AGET governance.
