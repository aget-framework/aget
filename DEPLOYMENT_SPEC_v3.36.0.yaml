  - scripts/migration_kit/write_scope_rules.py
  source_tests:
  - tests/migration_kit/conftest.py
  - tests/migration_kit/test_migration_kit_act_authority.py
  - tests/migration_kit/test_migration_kit_after_run_check.py
  - tests/migration_kit/test_migration_kit_batch_authority.py
