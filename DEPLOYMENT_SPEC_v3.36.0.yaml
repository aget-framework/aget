# Previous release: v3.35.1, published 2026-10-04 UTC. Planned tag: 2026-10-10.
# Migration paths: 3.35.0 to 3.36.0, or 3.35.1 to 3.36.0.
# From 3.35.0, include retained v3.35.1 content: study_topic.py fix 428ec9e
# and LICENSE for analyst, architect, executive, operator, researcher and reviewer.
# From 3.35.1, those files are already shipped; install the new kit at supervisors
# and apply version updates and template data corrections, preserving local extensions.
# Roll back a receiver to its recorded pre-upgrade baseline; rollback_ref names the previous release.
created: '2026-10-01'
status: released
supersedes: DEPLOYMENT_SPEC_v3.35.1.yaml
breaking_release: false
source_ref: v3.36.0
rollback_ref: v3.35.1
release_notes: release-notes/v3.36.0.md
release_handoff: handoffs/RELEASE_HANDOFF_v3.36.0.md
remote_migration: handoffs/REMOTE_MIGRATION_MESSAGE_v3.36.0.md
corrections: handoffs/CORRECTIONS_v3.36.0.md
payload_manifest: none
publication_boundary: Prepared content is not publication, installation or acceptance
  evidence. Record the annotated tag and peeled commit before consuming.
publication_state_note: 'Publication is evidenced by the annotated tag v3.36.0 and the GitHub Release object, and this field agrees with them. Planned publication date 2026-10-10. Read the peeled commit of the tag with: git rev-parse v3.36.0^{commit} (a file inside the tagged commit cannot name it). The corrections record named in the corrections field is not in this tagged commit; it is opened on main only if a correction is needed, so read it from main if it exists.'
mandatory_changes:
- id: M-3.36-1
  description: >-
    A fleet migration kit for supervisors ships in the core repository.
    A supervisor copies it from a core clone into its own repository; it is not part
    of any template. The kit reads its source and target releases from environment
    variables or .aget/migration_target.json and carries no default release. Release-specific
    names from the 3.35.0 migration remain in several tools (schema names, a fixed list
    of 3.35.0 payload paths and two more paths the code lists for 3.35.0 corrections row 4
    (the close-authorization guard and a test file for it), which fleet_ledger.py,
    prepare_batch.py and prepare_launch.py add to a member's expected payload whatever the
    target release, a receipt
    filename, three fixed validation commands a migrating or repair receiver is asked to run,
    and a fixed route text that a migrating member is told to record in its version history
    and receipt, and a repair member in its receipt only, unless the route option is
    passed). The typed-line check is per act and has limits. A push,
    and a launch without the copy-root option, are refused (exit 6) unless a recorded
    line is found in a prompt recorded as typed, or in a human-origin entry queued mid-turn whose
    prompt source the tool does not read (accepted, and reported by the tool as typed mid-turn). A launch with the copy-root option makes
    no authority check. It is refused (exit 2) unless the folder is apart from the member's
    own folder (not the same, not inside it, not containing it, not sharing its .git through
    a link), git run in it names the folder as its working tree and the folder's own .git
    as its git folder and common folder (so a copy whose core.worktree setting names the
    member, a linked worktree, and an environment holding GIT_DIR or a like variable are
    refused), holds in its .git a marker file that rehearse_v37.py writes, naming the packet
    file's digest and the member, has no git remote, and is at the packet's HEAD. The
    session rehearsal refuses, before it removes or copies anything, a copy folder that is
    the member's own folder, holds it or lies inside it, and makes the same git test on the
    copy before it applies or launches. That does
    not prove a throwaway copy, because the marker is a plain file and anyone able to write
    it can forge it. The session rule covers the launch command with
    any arguments. A launch line need not name the launch. The launch check binds the batch name; the push check binds the packet digest. Another packet with the same batch value passes the launch check on the same recorded line, whatever receivers it lists; a push from that other packet is refused. Launching the packet rehearsed and approved for the batch remains an operator rule. A push reads only a line recorded
    for the push (key <batch>:push, written by record_authority.py with --act push); the
    batch's launch line is never push authority. The push line must have one fixed form
    (the prefix, then "push the commits of batch N", optionally more batches and
    " with commit SHA", each SHA 7 to 40 hexadecimal characters, and nothing else) and must
    equal the whole typed prompt it is found in (runs of whitespace collapsed; a pasted
    block among other words is left out of the comparison). The baseline-equal ruling line
    gets the same whole-prompt test and has its own fixed form (the prefix, then
    "the failures at SHA are baseline-equal", SHA being 7 to 40 characters the commit's id
    starts with). This is a test of form, not a reading of meaning. A line worded any other
    way is refused, an affirmative one too, and the principal types the form; a condition
    that exists only inside a pasted block, and a later prompt that withdraws the push
    without repeating the line, are not read. A launch line is unchanged. It is matched as part of a typed
    prompt, the words typed around it are not read by the shape and exclusion tests, and it is
    refused as excluding the launch only when a recognized exclusion phrase comes shortly
    before the word launch in the same clause. For either act the batch must be named in the
    first batch list of the newest prompt that contains the line. A member dropped
    from the write list is not dropped from the launch by that; the launcher does not read
    the write list and takes its members from the packet, less those a non-empty --only list
    leaves out. Two push options (extra-paths, allow-dirty) are compared with no typed line. The extra-commit option must match a commit named in the recorded push line; when HEAD moved since the launch check, HEAD is compared with the longer matching id. With HEAD unchanged, a supplied extra commit does not change the checked commit the gate permits. A live
    launch of the members' migration sessions exits 0 whatever its after-run checks
    said, and a receiver that the push tool's per-receiver gate refuses does not make its exit
    code non-zero
    (it prints NOT PUSHED). The suite check at the commit (step B8a), run from the command
    line, reads the clone's HEAD after the suite and after the pre-push hook, and git status
    before the suite and after each when the suite left HEAD in place, with the content of
    the paths each status line names.
    A moved HEAD, or outside the paths named with the repeatable option --allow-path a new
    status line, a status line that is gone, or any other change to a file, link or folder
    of the working tree that git does not ignore, tracked or not (bytes, permission bits,
    a link's target), reads
    INCONCLUSIVE, which the push tool does not push, and the record keeps
    what was allowed and, unless the suite moved HEAD, the status lines (the first 40 of each
    reading). Untracked files
    under __pycache__ or .pytest_cache folders are left out, and a file git ignores and a
    change made and undone between two readings are not seen. The after-run check gives its confirmation clone, and each copied sibling folder
    that is a git repository, a push URL that cannot resolve before any test runs; if that
    cannot be done, or a declared sibling's .git is a file or a link, the candidates are not
    re-run and stay failures. A push to an explicit URL or path, and the environment that run
    inherits, are unchanged. The ledger (step B12) reads a member INCONCLUSIVE when it has a
    root workflow, has met the conditions the ledger tests before the workflow checks, and its
    workflow checks could not be compared with its pre-migration revision (revision not found,
    or a workflow tree unreadable), unless a check-change ruling is recorded for that member
    in the shape record_authority.py writes (a named check with its change and the principal's
    line); the row carries whether the comparison was made. Every copy and clone the kit makes
    (the packet rehearsal, the repair rehearsal, the session rehearsal, the suite check and the
    after-run confirmation run, each with its copied sibling folders) goes through one isolation
    routine, copy_isolation.py - the environment holds no variable that tells git where a
    repository is; the folder cleared and filled is not the member's own or one holding it;
    git run in the copy acts on the copy and nothing under its .git links outside it, or
    nothing is run in it; the push URL git would use is read back after it is set; remote definitions under .git/remotes and .git/branches are
    deleted; a copy of the member loses its other remotes, a clone of it and each copied sibling
    repository get a push URL that cannot resolve; a member copy with no .git of its own is refused.
    Not closed - a sibling folder with no .git (git run in its copy acts on any repository
    that encloses it), a symbolic link inside a copied sibling, a repository nested deeper in a
    copied sibling, a submodule, a branch whose remote is a path with no remote section, a
    remote added during the run, a push to an explicit URL or path, the alternates file, hooks,
    and what code does after it starts; no tool refuses an output or evidence folder placed
    inside a member's repository (operator rule). The suite check also compares .git/info/exclude
    and the value of core.excludesFile, not the file it names nor git's default ignore file, and
    runs only the pre-push hook at the default place (not one core.hooksPath names). A
    protected file is replaced only when it is byte for byte an upstream version; no write goes
    through a symbolic link (a protected path is unsafe in the protected-write list, and the
    apply refuses it at plan and write if a list names it as a write; an unprotected one is
    left unmigrated in the launch packet with an INCONCLUSIVE after-run reading);
    the apply step compares each listed file's bytes and requires the member's HEAD to equal the list entry's named HEAD (a missing HEAD refuses). The session rehearsal reports a verdict only
    from its own run - an earlier after-run record is removed first, and a session launch that
    does not exit 0 gives no verdict. By default the launch preparation
    takes the close-authorization guard and its test from core, not from the template. A
    migrating member whose copy differs from core's file is given that file when the copy
    holds no lines of its own, and is told to merge core's file with its own lines when it
    holds some. A resolved-file entry for the path makes the packet name the bytes that
    entry names as the path's source instead, and an exclude entry takes the path out of
    that member's items and records the reason. The templates ship the unrepaired guard. The operator rules
    that go with these limits are in the release notes (Authority checks - what the
    tools do and do not enforce) and are not enforced by the tools. A line passed
    as a session's launch argument is refused. The readiness run of
    wave_readiness.py needs four scripts this release does not ship; it names them
    and stops before writing anything. The batch procedure does not run that readiness
    run; other kit tools load that module for functions and constants. The module's
    privacy mode defaults to private unless the register portfolio explicitly declares privacy: public. Built, tested
    and rehearsed with Claude Code only. The second outcome run exercised two worker fixtures from 3.35.1 to 3.36.0, returning FAIL accepted as R59 named limits; real-fleet deployment is unverified. No action for an Aget that is not a supervisor.
    F-5 is fixed; the other named limits retain their workarounds.
    F-3 - Supervisor-template members have a runtime-skip limit - test_template_size_buffer calls pytest.skip() when AGENTS.md is at least 25,000 characters, and B2 reads that runtime skip as INCONCLUSIVE. Drop such a member from the batch and record the reason; it is not a kit migration pass.
    F-5 - Fixed. The default member suite command is python3 -m pytest -q -p no:cacheprovider, so pytest does not create .pytest_cache/.gitignore in a fresh checkout and the after-run ignore check does not read that cache file as a change. The baseline, step-5 prompt and rehearsals disable the cache provider; an explicit --suite-cmd still overrides the default. K-1 remains a named cost - templates declare no write scope, so their scope needs the principal's recorded override.
    F-6 - A member session that runs a targeted test command for one file instead of the declared step-5 suite reads INCONCLUSIVE; that narrower run is not the declared suite. At B1, pass prepare_launch.py --extra-step "AGET=For pytest, run only the declared step-5 suite command; do not run targeted test commands." (replace AGET with its register name); this adds an instruction, not enforcement or a change to the other required validation commands.
    F-8 - The kit updates @aget-version in AGENTS.md but leaves the @aget-canonical-specs reference to .../v<from>/specs unchanged, and no kit check reports it. After the batch, update that reference by hand to the target version in the member's own session, or record it as a stale reference in B13.
    hooks - A member whose core.hooksPath is /dev/null is refused for the session rehearsal - /dev/null is not a hooks folder inside the run that the kit can judge. If no hooks are wanted, run git config --local --unset-all core.hooksPath in the member before the batch and check its result, then confirm that git config --get-all core.hooksPath prints nothing and exits 1. The first command clears all local values; if the effective setting still appears, stop and record it rather than treating the workaround as complete. With no effective setting, Git uses its default hooks location, so check that no hooks are installed there.
