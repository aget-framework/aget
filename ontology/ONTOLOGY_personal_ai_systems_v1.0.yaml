  - id: C759
    uri: aget:concept/AppropriateReliance
    prefLabel: Appropriate Reliance
    altLabel:
      - "Designing for Appropriate Reliance"
      - "Reliance Calibration"
    definition: >
      Reliance is appropriate when the human's degree of dependence on automation matches the automation's actual capability — relying on it when it is correct and overriding it when it is wrong. Trust is the attitudinal mediator that guides reliance, especially where full understanding of the automation is impractical.
    theoreticalBasis:
      primary: Human factors / trust in automation (peer-reviewed)
      source: Lee & See, Human Factors 2004; Parasuraman & Riley 1997
    broader: null
    narrower: null
    related: null
    example: >
      Lee & See define appropriate reliance as the design target: trust calibrated to capability, avoiding both over-reliance (misuse) and under-reliance (disuse, per Parasuraman & Riley's use/misuse/disuse/abuse taxonomy). AGET's memory-layer claim-verification rule (L908/L939/L960 — "verify before recommending from a memory premise") is appropriate-reliance discipline applied to the agent's reliance on its OWN prior outputs.
    sources:
      - "Lee, J. D., & See, K. A. (2004). Trust in Automation: Designing for Appropriate Reliance. Human Factors, 46(1), 50-80. DOI: 10.1518/hfes.46.1.50_30392"
      - "Parasuraman, R., & Riley, V. (1997). Humans and Automation: Use, Misuse, Disuse, Abuse. Human Factors, 39(2), 230-253. DOI: 10.1518/001872097778543886"
    inScheme: aget:ontology/personal-ai-systems
    cluster: Human-AI Teaming & Calibrated Reliance
    status: active

  - id: C1240
    uri: aget:concept/EntityLifecycleState
    prefLabel: Entity Lifecycle State
    altLabel:
      - "Shared lifecycle state"
      - "Artifact state genus"
    definition: >
      The genus for the governed state of any AGET entity within its lifecycle, generalizing ConceptLifecycleState (C651) from ontology-concepts to ALL entities. A shared vocabulary (proposed -> active -> deprecated -> retired + terminal variants) that each entity SPECIALIZES rather than re-inventing a bespoke enum (R-OGE-12). Shared != uniform: a Goal `achieves`, an Initiative `graduates/folds`, a concept `retires` — each specializes the core.
    broader: null
    narrower:
      - aget:concept/ConceptLifecycleState
    related: null
    example: >
      Initiative uses ACTIVE/DORMANT/NASCENT/PROPOSED/COMPLETE/FOLDED; Plan uses Draft/In-Progress/Complete/Abandoned; Goal uses active/achieved — today all divergent, none drawing from a shared model. This genus is the model they map to.
    sources:
      - "R-OGE-12 (principal 'all', 2026-07-15); generalizes C651 ConceptLifecycleState."
      - "Entity Lifecycle Dimension (live): proposed->active->deprecated->retired."
    inScheme: aget:ontology/personal-ai-systems
    cluster: Genus Expansion
    status: provisional

  - id: C1064
    uri: aget:concept/FrictionReductionStrategy
    prefLabel: Friction Reduction Strategy
    altLabel:
      - "Friction Posture Strategy"
      - "Three-Posture Friction Model"
    definition: >
      A governance strategy that treats friction not as uniform waste to be eliminated but as a signal to be triaged across three postures: REDUCE avoidable/extraneous friction, PRESERVE-and-calibrate healthy (designed-in) friction, and CONVERGE captured friction to structure so it never recurs uncaptured. The strategically distinctive claim is that friction reduction is a classification problem, not an elimination problem.
    theoreticalBasis:
      primary: Compensating-control framing of governance ritual
      source: GOVERNANCE_PRINCIPLES.md (Healthy Friction); L918
    broader: null
    narrower:
      - aget:concept/HealthyFriction
    related:
      - aget:concept/FrictionTriage
    example: >
      A reported permission prompt is not auto-suppressed; it is triaged - if it gates authority expansion (public-repo write, instruction-surface edit) it is PRESERVED as healthy friction; if it is pure diagnostic overhead it is REDUCED via a settings rule; either way the event is CONVERGED to structure so it does not recur uncaptured (AGET 2026-06).
    sources:
      - "AGET GOVERNANCE_PRINCIPLES.md (Healthy Friction, :261)."
      - "L918: AGET as a High-Friction Implementation of an Individual-Sovereignty Future (2026-05-02)."
    scopeNote: >
      LANDED 2026-08-13 ([internal ref]) at its reserved draft-056 id. Draft `_DRAFT_FWRK-2026-056_concepts.yaml` also declared `aget:concept/FrictionConvergence` as a third narrower; that concept has never landed (0 definition sites), so the edge is omitted here rather than authored dangling. Restore it if and when FrictionConvergence lands.
    inScheme: aget:ontology/personal-ai-systems
    cluster: Trust & Governance
    status: active

  - id: C1066
    uri: aget:concept/HealthyFriction
    prefLabel: Healthy Friction
    altLabel:
      - "Calibrated Friction"
      - "Mandatory-Friction Principal-Elected-Block"
    definition: >
      A deliberately-imposed, calibrated enforcement posture sitting between Advisory (no friction) and Strict (hard block): friction is mandatory at an error-prone or authority-expanding step, but the principal may elect to proceed. It is a compensating control for a missing substrate primitive, not an artifact of immaturity. This is the PRESERVE pole — the friction that "is the way," not "in the way."
    theoreticalBasis:
      primary: Poka-yoke (mandatory friction at error-prone steps)
      source: Shingo 1986 (Toyota Production System); GOVERNANCE_PRINCIPLES.md:261
    broader: aget:concept/FrictionReductionStrategy
    narrower: null
    related:
      - aget:concept/FrictionTriage
      - aget:concept/FrictionReportingFrontDoorAntiPattern
    example: >
      Authority-expanding edit prompts on public-repo writes, self-edits to settings.local.json, and instruction-injection surfaces are NOT suppressed — they are "the ONLY hard gates on authority expansion" (AGET memory feedback-public-repo-edit-prompts-are-healthy-friction, 2026-06-14). /aget-go, D71 STRUCTURAL routing, and the Saturday push window (L735) are further operationalizations.
    sources:
      - "Shingo, S. (1986). Zero Quality Control: Source Inspection and the Poka-Yoke System. Productivity Press."
      - "AGET GOVERNANCE_PRINCIPLES.md (Healthy Friction, :261); L918."
    inScheme: aget:ontology/personal-ai-systems
    cluster: Trust & Governance
    status: active

  - id: C1069
    uri: aget:concept/FrictionTriage
    prefLabel: Friction Triage
    altLabel:
      - "Classify-Before-Reduce"
      - "Friction Classification Gate"
    definition: >
      The operation of classifying each reported friction event — before any remediation — as avoidable (reduce), structural/healthy (preserve), or owed (ledger). It is the hinge of the friction strategy: it routes events to the correct posture and prevents the default assumption that "reported friction" equals "friction to eliminate."
    theoreticalBasis:
      primary: Three-way friction classification
      source: CAP-SESSION-013-D (R-CLOSE-018)
    broader: null
    narrower: null
    related:
      - aget:concept/HealthyFriction
      - aget:concept/FrictionReductionStrategy
      - aget:concept/FrictionReportingFrontDoorAntiPattern
    example: >
      R-CLOSE-018 requires close-session to classify friction events as "avoidable, structural, or operational" before recording — the structural class is precisely the healthy friction that must NOT be routed to elimination.
    sources:
      - "AGET CAP-SESSION-013-D (R-CLOSE-017..020)."
    inScheme: aget:ontology/personal-ai-systems
    cluster: Trust & Governance
    status: active

  - id: C1072
    uri: aget:concept/FrictionReportingFrontDoorAntiPattern
    prefLabel: Friction-Reporting Front-Door Anti-Pattern
    altLabel:
      - "Untriaged Friction Capture Surface"
    definition: >
      A user-facing friction-reporting or friction-proposing skill that routes reported events straight to remediation/elimination WITHOUT a triage step becomes a lever for dissolving healthy friction. A capture front-door must classify first (avoidable / structural / owed); a front-door that only reduces is an attack surface on the compensating controls.
    theoreticalBasis:
      primary: Triage-before-remediate requirement on capture surfaces
      source: this study (2026-06-23); CAP-SESSION-013-D
    broader: null
    narrower: null
    related:
      - aget:concept/FrictionTriage
      - aget:concept/HealthyFriction
    example: >
      A hypothesized /aget-propose-friction or /aget-report-friction skill (named by the principal, built nowhere as of 2026-06-23) is valuable ONLY if it wraps the three-way triage; if it auto-routes "I hit friction" to "remove it," it can quietly disable poka-yoke gates such as the public-push window or STRUCTURAL skill routing.
    sources:
      - "AGET deep-study pipeline 2026-06-23 (friction reduction strategy)."
      - "AGET CAP-SESSION-013-D (R-CLOSE-018 three-way friction classification)."
    inScheme: aget:ontology/personal-ai-systems
    cluster: Trust & Governance
    status: active

  - id: C1075
    uri: aget:concept/ReleaseSkillRelianceContract
    prefLabel: Release Skill Reliance Contract
    altLabel:
      - "Release Capability Contract"
      - "Skill-at-Release-R Contract"
    scopeNote: >
      Per semver.org: "SemVer is a social contract between maintainers and consumers, not a technical enforcement mechanism... the version number is just a number" without a defined public API. AGET parallel: the reliance tiers are meaningful only against a defined core-skill set bound to R; the obligor that keeps the promise is the FrameworkManagerArchetype (C610) via release governance (curation -> 13-template distribution -> handoff). The contract is NOT runtime-enforced (L474-476 SAFE-not-GOVERNED) except at the 4 D71-Strict must-invoke routes. GAP: no canonical spec currently states this contract (see C1079; ARCHETYPE_SKILLS_INDEX gives a deployment split, not a reliance contract).
    definition: >
      The commitment, bound to a specific Aget release R, about which skills a Principal may rely on being present and behaving as specified ({S}), which are optional/adoptable ({O}), and that the {D} authoring path exists. The skills are, in effect, the version-bound public API of an Aget. Like a SemVer public API, the contract is a SOCIAL contract — a promise the release process keeps — not a runtime-enforced guarantee.
    theoreticalBasis:
      primary: Semantic Versioning 2.0.0 (public-API social contract)
      source: semver.org (Preston-Werner)
      secondary: L742 Two-Level Model (requirements vs enforceable contract)
    note: >
