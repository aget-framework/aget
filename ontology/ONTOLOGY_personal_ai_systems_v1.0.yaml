  - id: C671
    uri: aget:concept/AuthorAssertedCleanlinessAntiPattern
    prefLabel: Author-Asserted Cleanliness Anti-Pattern
    altLabel:
      - "Skill-Assert-Before-Verify"
      - "Vocabulary Confidence-As-Measurement"
    scopeNote: >
      Counter-perspective concept (anti-pattern). Replacing empirical validator output ("0 orphans / 0 dangling / all reciprocal") with author confidence. Family member of L908 self-application failure and L803 stratified-fact-check bypass.
    definition: >
      A failure mode where an ontology author or skill declares "0 defects" or "all clean" based on confidence rather than validator output. Skosify EKAW 2012 baseline (n=24, 100% defective) establishes that defects exist until measurement confirms otherwise.
    theoreticalBasis:
      primary: L736 Skill Assert-Before-Verify
      source: L736 (AGET internal)
      secondary: L803 Stratified Fact-Check
      secondarySource: L803 (AGET internal)
