  - id: C1075
    uri: aget:concept/ReleaseSkillRelianceContract
    prefLabel: Release Skill Reliance Contract
    altLabel:
      - "Release Capability Contract"
      - "Skill-at-Release-R Contract"
    scopeNote: |
      The framework manager is the obligor, the Principal the beneficiary, and the release process keeps the promise through release governance and delivery. For a particular release, the contract distinguishes specified skills that are present and behave as specified from optional or adoptable skills, and requires an authoring path. It is not a runtime-enforced guarantee of the whole contract. The source separately identifies four strict must-invoke routing exceptions. Its earlier observation that no canonical specification stated the contract is historical, not a current absence claim.
    definition: |
      A Release_Skill_Reliance_Contract is a promise kept by the release process and bound to a specific Aget release, about which skills a Principal may rely on being present and behaving as specified, which skills are optional or adoptable, and that an authoring path exists.
    theoreticalBasis:
      primary: Semantic Versioning 2.0.0 (public-API social contract)
      source: semver.org (Preston-Werner)
      secondary: L742 Two-Level Model (requirements vs enforceable contract)
    note: >
      "At release R" is the binding site: the same skill can be {O} at R and promoted to {S} at R+n (the SemVer MINOR-add analog — new backward- compatible capability added to the guaranteed set).
    broader: null
    narrower: null
    related: null
    inScheme: aget:ontology/personal-ai-systems
    cluster: Skill Reliance Contract

  - id: C2032
    uri: aget:concept/Agent
    prefLabel: Agent
    altLabel:
      - "Agent Entity"
      - "Acting Entity"
    scopeNote: |
      Distinguish the agent (the actor) from the mechanism it operates or is realized in (an agent system — software, an organization's procedures): the distinction L538 took from GM-RKB's Agent Entity vs Agent System, which exposed a conflation in an earlier AGET term. An Aget_Instance is an artificial agent; an Aget_Clone is not an agent at all but an artifact that realizes one. When an agent acts for another party, that party is its principal in the general agency sense; it is an AGET Principal only when it also meets that record’s conditions.
    definition: >
      An entity that perceives some part of its environment and acts on it in pursuit of goals — its own, or those of another party on whose behalf it acts. The genus is neutral about substrate: people, organizations, software and collectives can all be agents. What sets an agent apart from other entities is directed action, not what it is made of.
    broader: aget:concept/Entity
    narrower: null
    related:
      - aget:concept/Principal
      - aget:concept/CognitiveEntity
    example: >
      A person booking travel, a company negotiating a contract, and a coding assistant editing a repository on its user's instruction are all agents: each perceives a situation and acts in it toward a goal. The laptop the assistant runs on is not — it is part of the system through which that agent acts.
    sources:
      - "Russell, S. & Norvig, P. Artificial Intelligence: A Modern Approach (4th ed., 2020), ch. 2 — agent as that which perceives through sensors and acts through actuators"
      - "Jensen, M. C. & Meckling, W. H. (1976), Theory of the Firm — the agency relationship (acting on another's behalf)"
      - "Consulted: GM-RKB Agent Entity (mapping row in ontology/MAPPINGS_aget_to_gmrkb.sssom.tsv; L538)"
    inScheme: aget:ontology/personal-ai-systems
    cluster: Framework Metamodel
    status: active

  - id: C2150
    uri: aget:concept/CognitiveEntity
    prefLabel: Cognitive Entity
    definition: |
      A Cognitive_Entity is an Entity capable of performing cognitive processes, such as perception, memory, reasoning, learning, or decision-making.
    scopeNote: |
      Capacity for cognitive processing is required; consciousness is not asserted. An individual or collective qualifies only when it has that capacity; legal or organizational status alone is insufficient. Cognition here means interpreting and using information to support the entity’s own understanding or behaviour. Mere storage or fixed-rule switching by itself does not establish the capacity, and a single memory operation is not a membership test. Cognitive capacity alone does not grant a principal role or authorization. Agent denotes the existing perceiving-and-goal-directed-acting genus. Directed action and cognitive capacity are distinct criteria; neither alone establishes the other in this model. Cognitive Entity and Agent have a reciprocal related association. Principal has Cognitive Entity as its one direct parent and retains its Agent association. This is an explicitly stipulative AGET genus, not a claim of scientific consensus.
    broader: aget:concept/Entity
    narrower:
      - aget:concept/Principal
    related:
      - aget:concept/Agent
    sources:
      - 'Principal adoption, 2026-10-06: the concrete public-definition meaning package; existing AGET Principal and Agent definitions.'
    theoreticalBasis:
      primary: AGET stipulative cognitive-capacity distinction
      source: Existing Principal and Agent definitions; explicit principal adoption of the distinction.
      limit: No scientific consensus or unverified literature quotation is asserted.
    inScheme: aget:ontology/personal-ai-systems
    cluster: Public Definition Grounding
    status: active
