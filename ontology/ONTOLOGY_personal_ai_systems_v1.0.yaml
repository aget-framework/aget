# ONTOLOGY: AGET cited-concept subset v1.0
# A PROJECTION of the framework's canonical vocabulary, not a mirror: it holds exactly
# the concepts this repository cites (inline aget:concept/X, outside tests/) plus the
# broader concepts their definitions require. Links to concepts outside this subset
# are removed (142 dropped), so every link here resolves inside this file.
# Internal references in prose are replaced by visible markers (6 replaced).
# Concepts: 34 (30 cited + 4 parents).
# Generated from the canonical vocabulary @ 5dc6140d4db7381fc1bcdb5f68b5d18731bd3a4e by
# export_public_concept_tranche_ext.py. Do not edit by hand: regenerate.
# These are NOT the published w3id.org/aget/vocab concepts: a different set, and a
# different identifier scheme (aget:concept/X here).

apiVersion: aget.framework/v1
kind: OntologySpec
metadata:
  name: aget-cited-concept-subset
  version: 1.0.0

concepts:

  - id: C001
    uri: aget:concept/Principal
    prefLabel: Principal
    altLabel:
      - User
      - Data Subject
      - Garden Owner
    definition: >
      The cognitive entity whom AI agents serve and who retains ultimate
      authority over the system. In economics, the party who delegates
      authority to an agent.
    scopeNote: >
      Lefos: User who owns the Garden.
      AGET: Cognitive entity whom agents serve (L176 Worker Anchor).
    theoreticalBasis:
      primary: Principal-Agent Theory
      source: Jensen & Meckling 1976
      modernApplication: https://cmr.berkeley.edu/2025/07/rethinking-ai-agents-a-principal-agent-perspective/
    broader: null
    narrower: null
    related: null
    inScheme: aget:ontology/personal-ai-systems
    cluster: Identity & Ownership

  - id: C031
    uri: aget:concept/Stigmergy
    prefLabel: Stigmergy
    altLabel:
      - Environment-Mediated Coordination
      - Indirect Communication
    definition: >
      Coordination mechanism where agents communicate indirectly by
      modifying a shared environment, enabling decentralized cooperation.
    scopeNote: >
      Lefos: Garden modifications signal to Entity.
      AGET: KB modifications enable stigmergic coordination (L335).
    theoreticalBasis:
      primary: Stigmergy
      source: Grassé 1959
      reference: https://link.springer.com/chapter/10.1007/978-3-540-71103-2_7
      secondary: Stigmergy as Universal Coordination
      secondarySource: Heylighen 2016 (Cognitive Systems Research)
    related: null
    bridgingRole: >
      Both Garden and KB serve as stigmergic media - modifications by
      human or AI persist and influence future behavior. L-docs and
      session files are stigmergic traces that shape fleet evolution (L335).
    inScheme: aget:ontology/personal-ai-systems
    cluster: Bridging

  - id: C292
    uri: aget:concept/Thing
    prefLabel: Thing
    altLabel:
      - Top Concept
      - Universal
      - Conceptual Root
    definition: >
      The most general category in a SKOS conceptual hierarchy — anything
      that can be referred to, named, or made the subject of discourse,
      whether concrete or abstract. The conceptual root from which all
      narrower concepts in this ontology descend. Exists as the implicit
      topConcept anchoring cross-vocabulary alignment.
    theoreticalBasis:
      primary: SKOS Knowledge Organization
      source: Miles & Bechhofer 2009 (W3C Recommendation, SKOS Reference, 18 Aug 2009 §4-5)
      secondary: OWL Universal Class
      secondarySource: W3C OWL Working Group 2012 (OWL 2 Document Overview, owl:Thing)
    broader: null
    narrower:
      - aget:concept/Entity
    related: null
    example: >
      Every concept in AGET's Personal AI Systems Ontology — Principal,
      Agent, Requirement, Specification, Verification Test — ultimately
      descends from this root. The chain Thing → Entity → Artifact →
      Software → Software System → Software System Requirement is what
      lets aget:REQ-* declare a typed broader: parent rather than floating
      ungrounded.
    sources:
      - "Miles, A. & Bechhofer, S. (2009). SKOS Simple Knowledge Organization System Reference. W3C Recommendation 18 August 2009."
      - "W3C OWL Working Group (2012). OWL 2 Web Ontology Language Document Overview (Second Edition). W3C Recommendation 11 December 2012."
    inScheme: aget:ontology/personal-ai-systems
    cluster: Foundational CS/SE Hierarchy

  - id: C293
    uri: aget:concept/Entity
    prefLabel: Entity
    altLabel:
      - Existent
      - Bearer of Properties
    definition: >
      Any item assumed to exist — concrete or abstract, individual or
      collective — that can be the bearer of properties and stand in
      relations to other entities. Entities populate the world an
      ontology purports to describe and are the subject matter of
      ontological commitment.
    theoreticalBasis:
      primary: Scientific Ontology
      source: Bunge 1977 (Treatise on Basic Philosophy Vol 3 — Ontology I, D. Reidel, Ch.1 §1.1)
      secondary: Ontological Commitment
      secondarySource: Quine 1948 (On What There Is, Review of Metaphysics 2:5, pp.21-38)
    broader: aget:concept/Thing
    narrower:
      - aget:concept/EntityCharacterizationDimension
    related:
      - aget:concept/Principal
      - aget:concept/EntityDefinitionDimension
      - aget:concept/EntityInterrelationshipDimension
      - aget:concept/EntityActionDimension
      - aget:concept/EntityLifecycleDimension
      - aget:concept/EntityPersistenceDimension
      - aget:concept/EntityGovernanceDimension
      - aget:concept/EntityProvenanceDimension
    example: >
      In AGET, the Principal is an Entity (natural agent), the Agent is
      an Entity (artificial agent), and a Requirement is an Entity
      (informational artifact). Distinguishing 'what exists' from 'what
      is named' grounds why specifications must trace to concrete
      enforcement rather than floating as language. Per [internal ref],
      every Entity is characterizable along the 7 EntityCharacterization
      Dimensions (C535-C542).
    sources:
      - "Bunge, M. (1977). Treatise on Basic Philosophy, Vol 3: Ontology I — The Furniture of the World. D. Reidel, Dordrecht."
      - "Quine, W.V.O. (1948). On What There Is. Review of Metaphysics 2(5):21-38."
    inScheme: aget:ontology/personal-ai-systems
    cluster: Foundational CS/SE Hierarchy

  - id: C535
    uri: aget:concept/EntityCharacterizationDimension
    prefLabel: Entity Characterization Dimension
    altLabel:
      - Entity Description Facet
      - Entity Specification Axis
    definition: >
      A formally distinguishable axis along which any entity (artifact,
      agent, capability, requirement) MAY be characterized. A dimension is
      orthogonal to other dimensions when each adds independent expressive
      power to the entity's specification. Multi-dimensional schemes are
      content ontology design patterns whose dimensions can be added,
      removed, or evolved independently.
    theoreticalBasis:
      primary: Content Ontology Design Patterns
      source: Gangemi, A. (2005). Ontology Design Patterns for Semantic Web Content. ISWC 2005, LNCS 3729:262-276
      secondary: Faceted Classification (PMEST)
      secondarySource: Ranganathan, S.R. (1933). Colon Classification. Madras Library Association
    scopeNote: >
      Parent class for AGET's seven entity-characterization dimensions
      (Definition, Interrelationship, Action, Lifecycle, Persistence,
      Governance, Provenance). Sibling to existing single-purpose Dimension
      concepts (C380 Compliance Posture, C382 Cost-Awareness, C496
      Generative-Executive Verb).
    broader: aget:concept/Entity
    narrower:
      - aget:concept/EntityDefinitionDimension
      - aget:concept/EntityInterrelationshipDimension
      - aget:concept/EntityActionDimension
      - aget:concept/EntityLifecycleDimension
      - aget:concept/EntityPersistenceDimension
      - aget:concept/EntityGovernanceDimension
      - aget:concept/EntityProvenanceDimension
    related:
      - aget:concept/DimensionalFormalizationMaturity
      - aget:concept/MetaSpecificationGap
      - aget:concept/VocabularyFirstNamingDiscipline
    example: >
      An AGET Skill entity is fully specified when described along all 7
      dimensions: its Definition (SKOS prefLabel + spec), Interrelationships
      (related skills), Actions (the verb-noun grammar it implements),
      Lifecycle (proposed -> active -> deprecated), Persistence (skill file
      location), Governance (enforcement tier per ADR-008), and Provenance
      (which agent emitted it and when).
    sources:
      - "Gangemi, A. (2005). Ontology Design Patterns for Semantic Web Content. ISWC 2005, LNCS 3729, pp. 262-276. Springer. https://link.springer.com/chapter/10.1007/11574620_21"
      - "Ranganathan, S.R. (1933, expanded editions to 1987). Colon Classification. Madras Library Association."
      - "Glushko, R.J. (ed., 2016). The Discipline of Organizing (4th Pro Ed.). MIT Press, ch. Faceted Classification."
    inScheme: aget:ontology/personal-ai-systems
    cluster: Meta-Ontological Concepts

  - id: C536
    uri: aget:concept/EntityDefinitionDimension
    prefLabel: Entity Definition Dimension
    altLabel:
      - Entity Identity Facet
      - Entity Schema Axis
    definition: >
      The dimension along which an entity is given canonical name, formal
      definition, and typed structural schema (attributes, value domains).
      In AGET, instantiated as SKOS prefLabel + definition + JSON/YAML
      schema. Distinct from Persistence (where the entity is materialized)
      and from Lifecycle (which states it transitions through).
    theoreticalBasis:
      primary: ISO/IEC 11179 Data Element Concept / Value Domain split
      source: ISO/IEC 11179-4 (Formulation of data definitions); ISO/IEC 11179-5:2005 (Naming and identification principles)
      secondary: OntoClean Identity meta-property
      secondarySource: Guarino, N. & Welty, C. (2009). An Overview of OntoClean. In Handbook on Ontologies (2nd ed.), Springer, pp. 201-220
    broader: aget:concept/EntityCharacterizationDimension
    related:
      - aget:concept/Entity
    example: >
      L459 specifies 8 mid-level core entities (Person, Organization,
      Document, Decision, Event, Task, Project, Requirement) along this
      dimension via typed YAML schemas with required/optional attributes
      and enum value domains. An entity that lacks Definition-dimension
      coverage cannot be addressed in spec or skill.
    sources:
      - "ISO/IEC 11179-4 — Information technology — Metadata registries (MDR) — Part 4: Formulation of data definitions. https://www.iso.org/standard/35346.html"
      - "ISO/IEC 11179-5:2005 — Information technology — Metadata registries (MDR) — Part 5: Naming and identification principles. https://www.iso.org/standard/35347.html"
      - "Guarino, N. & Welty, C. (2009). An Overview of OntoClean. In Staab & Studer (eds.), Handbook on Ontologies (2nd ed.), Springer, pp. 201-220."
    inScheme: aget:ontology/personal-ai-systems
    cluster: Meta-Ontological Concepts

  - id: C537
    uri: aget:concept/EntityInterrelationshipDimension
    prefLabel: Entity Interrelationship Dimension
    altLabel:
      - Entity Relation Graph Axis
      - Entity Linkage Facet
    definition: >
      The dimension that captures how an entity stands in relation to other
      entities through typed edges with cardinality and inverse — both
      hierarchical (broader/narrower) and associative (related). Distinct
      from Definition (which captures intrinsic attributes) by capturing
      extrinsic position in a graph.
    theoreticalBasis:
      primary: SKOS Simple Knowledge Organization System
      source: Miles, A. & Bechhofer, S. (eds., 2009). SKOS Reference. W3C Recommendation 18 August 2009. https://www.w3.org/TR/skos-reference/
      secondary: OntoClean Dependence meta-property
      secondarySource: Guarino & Welty (2009), op. cit.
    broader: aget:concept/EntityCharacterizationDimension
    related:
      - aget:concept/Entity
      - aget:concept/EntityProvenanceDimension
    example: >
      L459's relationship blocks (e.g., Document.authored_by Person with
      cardinality 1:many and inverse 'authors') exemplify this dimension.
      AGET's vocabulary uses skos:broader/skos:narrower for hierarchy and
      skos:related for associative links; the L448 Bidirectional Linking
      Vision is the aspirational form.
    sources:
      - "Miles, A. & Bechhofer, S. (eds., 2009). SKOS Simple Knowledge Organization System Reference. W3C Recommendation. https://www.w3.org/TR/skos-reference/"
      - "Guarino, N. & Welty, C. (2009). An Overview of OntoClean. Handbook on Ontologies (2nd ed.), Springer."
    inScheme: aget:ontology/personal-ai-systems
    cluster: Meta-Ontological Concepts

  - id: C538
    uri: aget:concept/EntityActionDimension
    prefLabel: Entity Action Dimension
    altLabel:
      - Entity Verb-Skill Axis
      - Entity Operation Facet
    definition: >
      The dimension capturing the operations, verbs, and skills that may
      legitimately be applied TO or emitted BY an entity. In AGET,
      formalized via SVO skill grammar (aget-{verb}-{object}), the approved
      verb registry, and the 7-verb artifact lifecycle (propose, create,
      enhance, check, fix, deprecate, retire).
    theoreticalBasis:
      primary: BFO Occurrent / DOLCE Perdurant
      source: ISO/IEC 21838-2:2021 (BFO); Masolo et al. (2003) WonderWeb D17 — DOLCE
      secondary: PROV-O Activity class
      secondarySource: Lebo, T. et al. (eds., 2013). PROV-O. W3C Recommendation
    broader: aget:concept/EntityCharacterizationDimension
    related:
      - aget:concept/Entity
      - aget:concept/EntityProvenanceDimension
    example: >
      An AGET PROJECT_PLAN entity admits actions {/aget-create-project,
      /aget-enhance-project, /aget-check-initiative}. The action set is
      governed by SKILL_NAMING_CONVENTION_SPEC v1.4.0 + the verb registry
      (DESIGN_DIRECTION_skill_verb_vocabulary v3.16). Container-verb anti-
      pattern (L912) is a failure to specify this dimension cleanly.
    sources:
      - "ISO/IEC 21838-2:2021 — Information technology — Top-level ontologies (TLO) — Part 2: Basic Formal Ontology (BFO). https://www.iso.org/standard/74572.html"
      - "Masolo, C., Borgo, S., Gangemi, A., Guarino, N., Oltramari, A. (2003). WonderWeb Deliverable D17: The DOLCE ontology. LOA-ISTC, CNR."
      - "Lebo, T., Sahoo, S., McGuinness, D. (eds., 2013). PROV-O: The PROV Ontology. W3C Recommendation. https://www.w3.org/TR/prov-o/"
    inScheme: aget:ontology/personal-ai-systems
    cluster: Meta-Ontological Concepts

  - id: C539
    uri: aget:concept/EntityLifecycleDimension
    prefLabel: Entity Lifecycle Dimension
    altLabel:
      - Entity State Machine Axis
      - Entity Maturation Facet
    definition: >
      The dimension capturing the temporal-state machine through which an
      entity transitions: proposed -> active -> deprecated -> retired, and
      analogous registration progressions. Each transition is an Action;
      the dimension itself is the structured set of legitimate states.
    theoreticalBasis:
      primary: ISO/IEC 11179-6 Administered Item registration progression
      source: "ISO/IEC 11179-6:2023 — Information technology — Metadata registries (MDR) — Part 6: Registration"
      secondary: Records Continuum Model
      secondarySource: Upward, F. (2000). Modelling the continuum as paradigm shift. Records Management Journal 10(3); McKemmish, S. (2001). Placing Records Continuum Theory and Practice. Archival Science 1(4)
    broader: aget:concept/EntityCharacterizationDimension
    related:
      - aget:concept/Entity
      - aget:concept/EntityActionDimension
    example: >
      An AGET Specification entity transitions through the 7-phase
      enhancement lifecycle (L622): Phase 0 propose -> Phase 6 ratify.
      Each gate is a Lifecycle-dimension state; each /aget-enhance-spec
      invocation is an Action causing transition. POL-DEP-001 deprecation
      governance enforces grace-period invariants on retire transitions.
    sources:
      - "ISO/IEC 11179-6:2023 — Information technology — Metadata registries (MDR) — Part 6: Registration. https://cdn.standards.iteh.ai/samples/78916/7f79bc09f6f74ec490759c09f0d9f7ec/ISO-IEC-11179-6-2023.pdf"
      - "Upward, F. (2000). Modelling the continuum as paradigm shift in recordkeeping and archiving processes. Records Management Journal 10(3)."
      - "McKemmish, S. (2001). Placing Records Continuum Theory and Practice. Archival Science 1(4)."
    inScheme: aget:ontology/personal-ai-systems
    cluster: Meta-Ontological Concepts

  - id: C540
    uri: aget:concept/EntityPersistenceDimension
    prefLabel: Entity Persistence Dimension
    altLabel:
      - Entity Materialization Axis
      - Entity Storage Facet
    definition: >
      The dimension capturing where and in what form an entity is
      materialized: file system path, naming convention, version-control
      regime, canonical-vs-private location. Distinct from Lifecycle (which
      asks about state) by asking about location.
    theoreticalBasis:
      primary: FAIR Data Principles (Findable / Accessible)
      source: Wilkinson, M.D. et al. (2016). The FAIR Guiding Principles. Scientific Data 3:160018. DOI 10.1038/sdata.2016.18
      secondary: OAIS Information Package (SIP/AIP/DIP)
      secondarySource: ISO 14721:2012 — Open Archival Information System Reference Model
    scopeNote: >
      Persistence-vs-Lifecycle independence is contested. Gruber's (1995)
      Minimal Ontological Commitment principle warns that dimensions
      claimed orthogonal must justify the commitment cost; some authors
      treat Persistence as a Lifecycle facet. AGET treats them as separate
      because canonical-vs-private location (L910) is a Persistence concern
      that does not reduce to a Lifecycle state.
    broader: aget:concept/EntityCharacterizationDimension
    related:
      - aget:concept/Entity
      - aget:concept/EntityLifecycleDimension
    example: >
      An AGET PROJECT_PLAN persists at planning/PROJECT_PLAN_*.md (private)
      while a Spec persists at aget/specs/ (canonical). L910 surfaced that
      AGET had no formal contract for this canonical-vs-private split — a
      Persistence-dimension specification gap.
    sources:
      - "Wilkinson, M.D., Dumontier, M., Aalbersberg, I.J. et al. (2016). The FAIR Guiding Principles for scientific data management and stewardship. Scientific Data 3, 160018. https://www.nature.com/articles/sdata201618"
      - "ISO 14721:2012 — Space data and information transfer systems — Open Archival Information System (OAIS) — Reference model. https://www.iso.org/standard/57284.html"
      - "Masolo et al. (2003). WonderWeb D17 — DOLCE: Endurant wholly-present-at-instant principle."
    inScheme: aget:ontology/personal-ai-systems
    cluster: Meta-Ontological Concepts

  - id: C541
    uri: aget:concept/EntityGovernanceDimension
    prefLabel: Entity Governance Dimension
    altLabel:
      - Entity Authority Axis
      - Entity Trust-Tier Facet
    definition: >
      The dimension capturing who has authority to create, modify, approve,
      or retire an entity, and at what enforcement level. In AGET,
      formalized via the Decision Authority Matrix, ADR-008 enforcement
      progression (Advisory -> Strict -> Generator), and trust-tier
      classification (T0 confidential .. T3 external).
    theoreticalBasis:
      primary: UFO-C social-intentional layer (deontic / normative entities)
      source: "Guizzardi, G., Wagner, G., Almeida, J.P.A., Guizzardi, R.S.S. (2015). Towards ontological foundations for conceptual modeling: UFO. Applied Ontology 10(3-4):259-271. DOI 10.3233/AO-150157"
      secondary: ITIL Configuration Item governance
      secondarySource: "AXELOS (2019/2024). ITIL 4: Service Configuration Management; ISO/IEC 20000-1:2018"
    broader: aget:concept/EntityCharacterizationDimension
    related:
      - aget:concept/Entity
      - aget:concept/EntityProvenanceDimension
    example: >
      An AGET SPEC entity is governed by the Decision Authority Matrix
      ('Spec creation: Autonomous'), ADR-008 (enforcement tier per spec),
      and AGET_SECURITY_SPEC v0.2 trust-tier classification (most specs are
      T2 shared / T3 external). Governance gaps surface as L910-class
      findings — entities shipped without governance-dimension coverage.
    sources:
      - "Guizzardi, G., Wagner, G., Almeida, J.P.A., Guizzardi, R.S.S. (2015). Towards ontological foundations for conceptual modeling: The unified foundational ontology (UFO) story. Applied Ontology 10(3-4):259-271. https://journals.sagepub.com/doi/10.3233/AO-150157"
      - "AXELOS (2019/2024). ITIL 4: Service Configuration Management."
      - "ISO/IEC 20000-1:2018 — Information technology — Service management."
    inScheme: aget:ontology/personal-ai-systems
    cluster: Meta-Ontological Concepts

  - id: C542
    uri: aget:concept/EntityProvenanceDimension
    prefLabel: Entity Provenance Dimension
    altLabel:
      - Entity Lineage Axis
      - Entity Audit-Trail Facet
    definition: >
      The dimension capturing the origin, derivation history, and
      attribution of an entity: who created it, what activity generated it,
      from what prior entity it was derived, and what evidence supports it.
      In AGET, formalized via decision logs, Authorization records (CAP-PP-
      019-04), and PIR/retrospective scoring.
    theoreticalBasis:
      primary: W3C PROV Ontology (Entity / Activity / Agent triad)
      source: "Lebo, T., Sahoo, S., McGuinness, D. (eds., 2013). PROV-O: The PROV Ontology. W3C Recommendation 30 April 2013. https://www.w3.org/TR/prov-o/"
      secondary: PROV Data Model
      secondarySource: "Moreau, L., Missier, P. (eds., 2013). PROV-DM: The PROV Data Model. W3C Recommendation. https://www.w3.org/TR/prov-dm/"
    broader: aget:concept/EntityCharacterizationDimension
    related:
      - aget:concept/Entity
      - aget:concept/EntityActionDimension
    example: >
      An AGET L-doc entity (e.g., L918) carries provenance via its decision
      log (created date, author, triggering observation), back-references
      to prior L-docs (wasDerivedFrom equivalent), and citation of evidence
      sources (wasInformedBy). Authorization records (new at v3.16) extend
      provenance to gate-go events: every /aget-go invocation writes a
      record naming the principal, the principle triad invoked, and the
      authorized scope.
    sources:
      - "Lebo, T., Sahoo, S., McGuinness, D. (eds., 2013). PROV-O: The PROV Ontology. W3C Recommendation. https://www.w3.org/TR/prov-o/"
      - "Moreau, L., Missier, P. (eds., 2013). PROV-DM: The PROV Data Model. W3C Recommendation. https://www.w3.org/TR/prov-dm/"
    inScheme: aget:ontology/personal-ai-systems
    cluster: Meta-Ontological Concepts

  - id: C543
    uri: aget:concept/DimensionalFormalizationMaturity
    prefLabel: Dimensional Formalization Maturity
    altLabel:
      - Per-Dimension Maturity Grading
      - Dimensional Coverage Score
    definition: >
      An ordinal grading of how formally an entity's characterization on a
      given dimension is specified, ranging from convention-only (level 1)
      through documented (2), specified with R-/CAP- (3), validated by
      tests (4), to fully formalized stack — spec + schema + validator +
      tests + tooling (5). Per-dimension grading reveals lopsided coverage
      patterns that whole-entity averages obscure.
    theoreticalBasis:
      primary: CMMI Maturity Levels (5-level staged model)
      source: CMMI Institute / ISACA (2023). CMMI Model V3.0; Paulk, M. et al. (1993) — SEI/CMU origin
      secondary: ISO/IEC 25010 quality characteristics
      secondarySource: ISO/IEC 25010:2011 (and 2023 rev.) — System and software quality models
    broader: aget:concept/EntityCharacterizationDimension
    related:
      - aget:concept/MetaSpecificationGap
    example: >
      AGET v3.16 entities show lopsided maturity: Definition dimension
      ~level 4 (AGET_VOCABULARY_SPEC + ontology + schemas), Action
      dimension ~level 4 (SKILL_NAMING_CONVENTION_SPEC + V-validators +
      contract tests), but Provenance dimension ~level 2 (decision logs +
      Authorization records as new primitive, no formal contract). Mean
      maturity ~3.1/5 reveals the meta-spec gap.
    sources:
      - "CMMI Institute / ISACA (2023). CMMI Model V3.0. https://cmmiinstitute.com/learning/appraisals/levels"
      - "Paulk, M.C., Curtis, B., Chrissis, M.B., Weber, C.V. (1993). Capability Maturity Model for Software, Version 1.1. SEI/CMU Technical Report CMU/SEI-93-TR-024."
      - "ISO/IEC 25010:2011 — Systems and software engineering — SQuaRE — System and software quality models. https://www.iso.org/standard/35733.html"
    inScheme: aget:ontology/personal-ai-systems
    cluster: Meta-Ontological Concepts

  - id: C544
    uri: aget:concept/MetaSpecificationGap
    prefLabel: Meta-Specification Gap
    altLabel:
      - Dimension-Coverage Gap
      - Per-Dimension Specification Slack
    definition: >
      COUNTER-PERSPECTIVE. Anti-pattern in which an entity is shipped with
      strong specification on some characterization dimensions but absent
      or weak on others, with no META-SPEC requiring multi-dimensional
      coverage. Per L671 (Classification Without Consequence), per-
      dimension specification without meta-coverage requirement is
      decorative metadata at the architectural level.
    theoreticalBasis:
      primary: Minimal Ontological Commitment Principle
      source: Gruber, T.R. (1995). Toward Principles for the Design of Ontologies Used for Knowledge Sharing. International Journal of Human-Computer Studies 43:907-928
      secondary: Classification Without Consequence (AGET internal — L671)
      secondarySource: AGET .aget/evolution/L671_classification_without_consequence.md
    related:
      - aget:concept/EntityCharacterizationDimension
      - aget:concept/DimensionalFormalizationMaturity
      - aget:concept/NormativeConceptBinding
      - aget:concept/SpecificationToOntologyBinding
      - aget:concept/VocabularyDecorationFailure
    example: >
      v3.16 shipped 5 new entity types (Authorization Record, Trust Tier,
      .agetignore, Healthy Friction Primitive, Sleeping Requirement) with
      strong Action and Governance coverage but zero Provenance and
      partial Definition (none promoted to AGET_VOCABULARY_SPEC Part 6).
      Without a meta-spec requiring all-7-dimension coverage, this gap is
      undetectable at release time.
    sources:
      - "Gruber, T.R. (1995). Toward Principles for the Design of Ontologies Used for Knowledge Sharing. IJHCS 43:907-928. https://tomgruber.org/writing/onto-design/"
      - "AGET internal: .aget/evolution/L671_classification_without_consequence.md (Classification Without Consequence pattern)."
    inScheme: aget:ontology/personal-ai-systems
    cluster: Meta-Ontological Concepts

  - id: C547
    uri: aget:concept/VocabularyFirstNamingDiscipline
    prefLabel: Vocabulary-First Naming Discipline
    altLabel:
      - Pre-Coinage Ontology Check
      - Governed-Discourse Grounding
    definition: >
      Discipline mandating that before proposing new terminology, concept
      names, or entity types, agents check existing controlled vocabulary
      for established prefLabels and reuse them — or document why
      divergence is needed. Prevents vocabulary fragmentation and fulfills
      the L795 Governed Discourse Grounding contract.
    theoreticalBasis:
      primary: SKOS prefLabel discipline (W3C 2009)
      source: Miles, A. & Bechhofer, S. (eds., 2009). SKOS Reference. W3C Recommendation
      secondary: Governed Discourse Grounding (AGET internal — L795)
      secondarySource: AGET .aget/evolution/L795_governed_discourse_grounding.md
    related:
      - aget:concept/EntityCharacterizationDimension
      - aget:concept/EntityDefinitionDimension
    example: >
      The [internal ref] expansion that introduced C535-C547 is itself an
      instance of this discipline: before authoring AGET_ENTITY_DIMENSION_
      SPEC, the agent grounded the 7-dimension model in SKOS so the spec
      can reference established prefLabels rather than coining new terms.
      Reverse application: container-verb anti-pattern (L912) is a failure
      of this discipline at the verb-naming level.
    sources:
      - "Miles, A. & Bechhofer, S. (eds., 2009). SKOS Reference. W3C Recommendation. https://www.w3.org/TR/skos-reference/"
      - "AGET internal: .aget/evolution/L795_governed_discourse_grounding.md (Governed Discourse Grounding)."
    inScheme: aget:ontology/personal-ai-systems
    cluster: Meta-Ontological Concepts


  - id: C641
    uri: aget:concept/NormativeConceptBinding
    prefLabel: Normative Concept Binding
    altLabel:
      - "Inline Normative Reference"
      - "SHALL-Binding Discipline"
    definition: >
      An inline reference from a specification, requirement, or governance rule to an ontology concept URI such that the rule's interpretation is constrained by the bound concept (e.g., "SHALL be interpreted in terms of aget:concept/X"). Distinguishes operational binding from citation-only mention.
    theoreticalBasis:
      primary: DPCL Language Template for Normative Specifications
      source: Padget et al. (2022), arxiv 2201.04477
      secondary: ISO 15531 Mandate Standard ontology extraction
      secondarySource: Cutting-Decelle et al. (2018), arxiv 1806.02242
    broader: null
    narrower:
      - aget:concept/InlineUriReference
      - aget:concept/SpecificationToOntologyBinding
    related:
      - aget:concept/MetaSpecificationGap
      - aget:concept/VocabularyDecorationFailure
    example: >
      L924 (2026-05-04) empirically established that AGET's 66 specs + 6 requirements contained 0 inline normative bindings to its 495-concept ontology. Mention by range is not binding; only inline "SHALL be interpreted in terms of aget:concept/X" creates operational consequence.
    sources:
      - "DPCL: A Language Template for Normative Specifications, arxiv 2201.04477 (2022)"
      - "L924: Ontology-Spec Binding Gap Systemic (2026-05-04)"
      - "AGENTS.md §SVO Skill Grammar — inline aget:concept/X usage pattern"
    inScheme: aget:ontology/personal-ai-systems
    cluster: Ontology Grounding, Lifecycle & Validation
    status: active

  - id: C642
    uri: aget:concept/InlineUriReference
    prefLabel: Inline URI Reference
    altLabel:
      - "In-Body URI Citation"
      - "Inline Concept Hyperlink"
    definition: >
      A URI reference (typically curie-prefixed, e.g., aget:concept/X) embedded directly in the prose body of a specification or document, rather than relegated to metadata or annotation blocks. Visible, navigable entity references outperform JSON-LD-only markup for both human review and machine-readable RAG retrieval.
    theoreticalBasis:
      primary: Grounding Page Standard v1.6
      source: groundingpage.com/spec/ (2026)
      secondary: Entity-centric RAG retrieval accuracy
      secondarySource: Volpini et al. (2026) cited in testerstories.com 2026-03
    broader: aget:concept/NormativeConceptBinding
    narrower: null
    related: null
    example: >
      Volpini et al. (2026) measured ~30% accuracy improvement in RAG pipelines when entity content is navigable in body prose vs. JSON-LD-only markup. AGENTS.md uses inline `aget:concept/X` curies; AGET specs currently do not.
    sources:
      - "Grounding Page Standard v1.6, https://groundingpage.com/spec/"
      - "AI and Testing: From Specification to Ontology, testerstories.com (2026-03)"
    inScheme: aget:ontology/personal-ai-systems
    cluster: Ontology Grounding, Lifecycle & Validation
    status: active

  - id: C643
    uri: aget:concept/ConceptPinningByVersion
    prefLabel: Concept Pinning by Version
    altLabel:
      - "Vocabulary Version Pinning"
      - "Bound-Version Reference"
    definition: >
      The discipline of declaring the ontology version a specification binds to, so that downstream consumers pin to a specific vocabulary release and upgrade deliberately. Without pinning, vocabulary evolution silently breaks specification semantics.
    theoreticalBasis:
      primary: Ontology Management Operating Model — Versioning & Change Control
      source: getgalaxy.io articles ontology-management (accessed 2026-05-20)
    broader: aget:concept/NormativeConceptBinding
    narrower: null
    related:
      - aget:concept/BindOnceDecayOften
    example: >
      AGET ontology is at v8.10.0; no spec currently declares which ontology version its aget:concept/X references resolve against. Galaxy ontology management best practice: "Version the artifacts that downstream systems bind to; consumers pin to a specific version and upgrade deliberately."
    sources:
      - "Galaxy: Ontology Management Operating Model"
      - "CSIRO Information Engineering — Best practice in formalizing a SKOS vocabulary"
    inScheme: aget:ontology/personal-ai-systems
    cluster: Ontology Grounding, Lifecycle & Validation
    status: active

