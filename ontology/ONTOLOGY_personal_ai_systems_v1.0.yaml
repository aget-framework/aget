      tertiarySource: L908 (AGET internal)
    broader: null
    narrower: null
    related: null
    example: >
      L736 (Skill Assert-Before-Verify) is the AGET-internal naming; /aget-expand-ontology Step 7a empirical confirmation requirement is the structural remediation: "Author-asserted '0 orphans / 0 dangling / all reciprocal' claims MUST be replaced with validator output."
    sources:
      - "L736: Skill Assert-Before-Verify"
      - "L803: Stratified Fact-Check"
