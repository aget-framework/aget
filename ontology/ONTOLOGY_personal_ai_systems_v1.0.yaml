  - id: C650
    uri: aget:concept/BindOnceDecayOften
    prefLabel: Bind-Once-Decay-Often
    altLabel:
      - "Binding Rot"
      - "Stale Binding Failure"
    scopeNote: >
      Counter-perspective concept. A binding made at time T to concept-version V silently rots as the ontology evolves past V without spec updates.
    definition: >
      A failure mode where a specification binds to an ontology concept at one point in time, the ontology subsequently evolves (concept renamed, deprecated, split, merged), and the binding is not maintained — leading to phantom references, semantic drift, or broken validators.
    theoreticalBasis:
      primary: Vocabulary versioning failure modes
      source: Galaxy Ontology Management Operating Model (2026)
    broader: null
    narrower: null
    related:
      - aget:concept/ConceptPinningByVersion
    example: >
      Anticipated failure mode for INIT-ONTOLOGY-SPEC-BINDING. Mitigation: Concept Pinning by Version (C643) + Binding Validator (C666) in CI, so binding rot is detected at vocabulary release rather than at downstream consumer break.
    sources:
      - "Galaxy: Ontology Management Operating Model"
      - "AGET POL-DEP-001 deprecation policy (analogous discipline)"
    inScheme: aget:ontology/personal-ai-systems
    cluster: Ontology Grounding, Lifecycle & Validation
    status: active

  - id: C651
    uri: aget:concept/ConceptLifecycleState
    prefLabel: Concept Lifecycle State
    altLabel:
      - "Vocabulary Entry State"
      - "SKOS Concept Status"
    definition: >
      The governed state of an ontology concept within an editorial workflow, typically one of: Candidate (proposed, under review), Active (committed, bindable), Deprecated (replaced, grace period), Retired (removed from bindable surface). Distinct from concept ID assignment, which is permanent.
    theoreticalBasis:
